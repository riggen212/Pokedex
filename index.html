<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <link rel="stylesheet" href="./style.css">
    <script src="./scripts/template.js" defer></script>
    <script src="./scripts/script.js" defer></script>
    <link rel="shortcut icon" href="./assets/icons/favicon.png" type="image/x-icon">

</head>

<body onload="init()">
    <header class="head">
        <div class="contentArea">
            <img src="./assets/logos/pokedex_logo.png" alt="">
            <search>
                <input type="text" id="searchField" placeholder="insert a name...">
            </search>
        </div>
    </header>

    <main data-id="content" id="cardContainer">

        <div id="progress-container" style="display: none; margin: 20px 0;">
            <progress id="progress-bar" value="0" max="20" style="width: 100%; height: 20px;"></progress>
            <p id="progress-text">Lade Pokémon: 0 / 20</p>
        </div>
        <section>
            <button class="btnLoadMore" onclick="loadMoreCreatures()">load more creatures</button>
        </section>
    </main>

    <footer>

    </footer>

    <dialog data-id="dialog" id="detailCard"></dialog>

    <dialog id="loading" class="loading">
        <div class="loadingContainer">
            <div class="loadingSpinner"></div>
            <div id="loadingText" class="loadingText">0%</div>
        </div>
    </dialog>
</body>

</html>
